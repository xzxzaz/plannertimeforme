<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Обратный тайм-менеджер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Строгий монохромный стиль */
        * { box-sizing: border-box; }
        body { 
            background-color: #000000; 
            color: #FFFFFF; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; 
            padding: 16px; 
        }
        .card { 
            background-color: #111111; 
            border: 1px solid #333333; 
            border-radius: 8px; 
            padding: 16px; 
            margin-bottom: 16px; 
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 600;}
        .clock { font-family: monospace; font-size: 1.2em; color: #aaaaaa; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #aaaaaa;}
        
        input { 
            background: #000000; 
            color: #FFFFFF; 
            border: 1px solid #333333; 
            padding: 10px; 
            border-radius: 6px; 
            outline: none; 
            width: 100%;
            font-size: 16px;
        }
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        
        .btn-add { 
            background: #FFFFFF; 
            color: #000000; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            width: 100%; 
            font-weight: 600; 
            cursor: pointer; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-add:active { background: #cccccc; }

        .task-list { margin-top: 15px; }
        .task-row { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 10px; 
            align-items: center;
        }
        .task-row input[type="text"] { flex: 1; }
        .task-row input[type="number"] { width: 70px; text-align: center; }
        .btn-del { 
            background: transparent; 
            border: 1px solid #333; 
            color: #fff; 
            width: 40px; 
            height: 40px; 
            border-radius: 6px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        .result-block { text-align: center; display: none; }
        .result-title { font-size: 1.5em; font-weight: bold; margin-bottom: 5px; }
        .result-subtitle { color: #aaaaaa; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span>▪️ ТЕКУЩЕЕ ВРЕМЯ</span>
            <span class="clock" id="live-clock">--:--</span>
        </div>
        <div class="input-group" style="margin-bottom: 0;">
            <label>🔘 Целевое время (во сколько нужно быть на месте):</label>
            <input type="time" id="target-time" onchange="calculate()">
        </div>
    </div>

    <div class="card">
        <div style="font-weight: 600; margin-bottom: 10px;">▪️ СПИСОК ДЕЛ</div>
        <div class="task-list" id="task-list"></div>
        <button class="btn-add" onclick="addTask()">➕ Добавить этап</button>
    </div>

    <div class="card result-block" id="result-block">
        <div class="result-title">Время старта: <span id="out-start">--:--</span></div>
        <div class="result-subtitle" id="out-left"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        let planData = null;

        // Живые часы
        function updateClock() {
            const now = new Date();
            const hs = now.getHours().toString().padStart(2, '0');
            const ms = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('live-clock').innerText = `${hs}:${ms}`;
            setTimeout(updateClock, 1000 - now.getMilliseconds());
            calculate(); // Периодический перерасчет остатка времени
        }
        updateClock();

        function addTask() {
            const container = document.getElementById('task-list');
            const row = document.createElement('div');
            row.className = 'task-row';
            row.innerHTML = `
                <input type="text" class="task-name" placeholder="Название (напр. Душ)" oninput="calculate()">
                <input type="number" class="task-dur" placeholder="Мин" min="1" oninput="calculate()">
                <button class="btn-del" onclick="this.parentElement.remove(); calculate()">✖️</button>
            `;
            container.appendChild(row);
        }

        // Автокалькулятор
        function calculate() {
            const targetVal = document.getElementById('target-time').value;
            const rows = document.querySelectorAll('.task-row');
            
            let totalMinutes = 0;
            let tasks = [];

            rows.forEach(row => {
                const name = row.querySelector('.task-name').value.trim();
                const dur = parseInt(row.querySelector('.task-dur').value) || 0;
                if (name && dur > 0) {
                    totalMinutes += dur;
                    tasks.push({name, dur});
                }
            });

            if (!targetVal || tasks.length === 0) {
                document.getElementById('result-block').style.display = 'none';
                tg.MainButton.hide();
                planData = null;
                return;
            }

            const [h, m] = targetVal.split(':').map(Number);
            let targetDate = new Date();
            targetDate.setHours(h, m, 0, 0);

            // Если указанное время уже прошло сегодня, считаем на завтра
            if (targetDate < new Date()) {
                targetDate.setDate(targetDate.getDate() + 1);
            }

            // Рассчитываем время старта
            let startDate = new Date(targetDate.getTime() - totalMinutes * 60000);
            let now = new Date();
            let diffMinutes = Math.floor((startDate - now) / 60000);

            const sH = startDate.getHours().toString().padStart(2, '0');
            const sM = startDate.getMinutes().toString().padStart(2, '0');
            
            document.getElementById('out-start').innerText = `${sH}:${sM}`;
            
            const leftEl = document.getElementById('out-left');
            if (diffMinutes > 0) {
                leftEl.innerText = `⏳ До начала сборов осталось: ${diffMinutes} мин`;
                leftEl.style.color = '#aaaaaa';
                
                // Настройка MainButton от Telegram
                tg.MainButton.setText('🔘 СОХРАНИТЬ ПЛАН И ЗАВЕСТИ БУДИЛЬНИК');
                tg.MainButton.show();
            } else {
                leftEl.innerText = `✖️ Время старта уже прошло!`;
                leftEl.style.color = '#ff4444';
                tg.MainButton.hide(); // Нельзя сохранить просроченный план
            }

            document.getElementById('result-block').style.display = 'block';

            // Формируем данные для отправки в бот (Unix Time)
            planData = {
                start_ts: Math.floor(startDate.getTime() / 1000),
                target_ts: Math.floor(targetDate.getTime() / 1000),
                total_min: totalMinutes,
                tasks: tasks
            };
        }

        tg.MainButton.onClick(() => {
            if (planData) {
                tg.sendData(JSON.stringify(planData));
                tg.close();
            }
        });

        // Добавляем пустую задачу по умолчанию
        addTask();
    </script>
</body>
</html>
